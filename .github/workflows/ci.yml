name: Full-Stack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests (Node + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package.json
      - name: Install backend dependencies
        run: npm install
        working-directory: backend
      - name: Run Prisma Generate
        run: npx prisma generate
        working-directory: backend
      - name: Run Vitest API tests
        run: npm test
        working-directory: backend

  frontend-test:
    name: Frontend Tests (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: mobile_frontend
      - name: Run Flutter unit tests
        run: flutter test
        working-directory: mobile_frontend

  web-test:
    name: Web Tests (React + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom and vitest need Node 22+; 24 matches local dev
          node-version: 24
          cache: "npm"
          cache-dependency-path: web_frontend/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web_frontend
      - name: Type-check and build
        run: npm run build
        working-directory: web_frontend
      - name: Run Vitest unit and component tests
        run: npm test
        working-directory: web_frontend

  codegen-check:
    # The schema export and both clients' codegen are run by hand after a
    # schema change. This regenerates everything and fails if the result
    # differs from what's committed, so a forgotten step can't slip through.
    name: Generated Code Up To Date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Export the schema (writes backend/ and Flutter's copy)
        run: npm install && npm run schema:export
        working-directory: backend
      - name: Web codegen
        run: npm ci && npm run codegen
        working-directory: web_frontend
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Flutter codegen
        run: flutter pub get && dart run build_runner build --delete-conflicting-outputs
        working-directory: mobile_frontend
      - name: Fail if anything changed
        run: |
          changed=$(git status --porcelain -- backend/schema.graphql \
            mobile_frontend/lib/core/graphql/schema.graphql \
            'mobile_frontend/lib/**/*.graphql.dart' web_frontend/src/gql)
          if [ -n "$changed" ]; then
            echo "Generated files are out of date. Run npm run schema:export in backend/,"
            echo "npm run codegen in web_frontend/ and dart run build_runner build in"
            echo "mobile_frontend/, then commit the result:"
            echo "$changed"
            exit 1
          fi

  web-e2e:
    name: Web End-to-End (Playwright)
    # after the backend deploy, so the test runs against the pushed backend.
    # deploy-backend is skipped outside pushes to main, which is fine too.
    needs: [web-test, deploy-backend]
    if: ${{ !cancelled() && needs.web-test.result == 'success' && needs.deploy-backend.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      # a real browser against the deployed API; each run signs up a fresh
      # throwaway account, so runs never collide
      VITE_API_URL: https://backend-test-graphql.onrender.com/graphql
    steps:
      - uses: actions/checkout@v4
      # The deploy hook only starts a deploy. When this push changed the
      # backend, wait (up to 10 minutes) until Render serves this commit.
      - name: Wait for the backend deploy
        if: needs.deploy-backend.outputs.backend-changed == 'true'
        run: |
          for i in $(seq 1 40); do
            deployed=$(curl -s https://backend-test-graphql.onrender.com/version | grep -o '[0-9a-f]\{40\}' || true)
            if [ "$deployed" = "$GITHUB_SHA" ]; then echo "Backend is on $GITHUB_SHA"; exit 0; fi
            sleep 15
          done
          echo "Backend still isn't on $GITHUB_SHA after 10 minutes"
          exit 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: web_frontend/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web_frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web_frontend
      - name: Run Playwright checkout flow
        run: npm run test:e2e
        working-directory: web_frontend
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web_frontend/test-results
          retention-days: 7

  deploy-backend:
    name: Deploy Backend to Render
    needs: [backend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      # Only redeploy when the backend itself changed. Web/mobile-only pushes
      # would otherwise restart the API for nothing.
      - name: Check for backend changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
      - name: Trigger Render Deploy Hook
        if: steps.changes.outputs.backend == 'true'
        # i accidentally had the hook key here so i regenerated it and replaced it with a new private one.
        # the key used for past pushes wont work.
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
