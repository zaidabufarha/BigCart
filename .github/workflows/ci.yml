name: Full-Stack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests (Node + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package.json
      - name: Install backend dependencies
        run: npm install
        working-directory: backend
      - name: Run Prisma Generate
        run: npx prisma generate
        working-directory: backend
      - name: Run Vitest API tests
        run: npm test
        working-directory: backend

  frontend-test:
    name: Frontend Tests (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: mobile_frontend
      - name: Run Flutter unit tests
        run: flutter test
        working-directory: mobile_frontend

  web-test:
    name: Web Tests (React + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web_frontend/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web_frontend
      - name: Type-check and build
        run: npm run build
        working-directory: web_frontend
      - name: Run Vitest unit and component tests
        run: npm test
        working-directory: web_frontend

  web-e2e:
    name: Web End-to-End (Playwright)
    needs: [web-test]
    runs-on: ubuntu-latest
    env:
      # a real browser against the deployed API; each run signs up a fresh
      # throwaway account, so runs never collide
      VITE_API_URL: https://backend-test-graphql.onrender.com/graphql
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web_frontend/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web_frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web_frontend
      - name: Run Playwright checkout flow
        run: npm run test:e2e
        working-directory: web_frontend
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web_frontend/test-results
          retention-days: 7

  deploy-backend:
    name: Deploy Backend to Render
    needs: [backend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only redeploy when the backend itself changed. Web/mobile-only pushes
      # would otherwise restart the API for nothing.
      - name: Check for backend changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
      - name: Trigger Render Deploy Hook
        if: steps.changes.outputs.backend == 'true'
        # i accidentally had the hook key here so i regenerated it and replaced it with a new private one.
        # the key used for past pushes wont work.
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
